media:
  input: public/media
  output: /media

content:
  - name: blog
    label: Blog Posts
    type: collection
    path: src/content/blog
    filename: "{fields.title}"
    fields:
      - name: title
        label: Title
        type: string
      - name: description
        label: Description
        type: string
      - name: pubDate
        label: Publication Date
        type: date
      - name: body
        label: Body
        type: rich-text
